name: Build Android Widget

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-widget/**'
      - '.github/workflows/build-widget.yml'

permissions:
  contents: write

env:
  ADMIN_CODE: ${{ secrets.ADMIN_CODE }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-widget
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Restore persistent release signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo 'Missing GitHub Secret: SIGNING_KEYSTORE_BASE64'; exit 1; }
          test -n "$SIGNING_STORE_PASSWORD" || { echo 'Missing GitHub Secret: SIGNING_STORE_PASSWORD'; exit 1; }
          test -n "$SIGNING_KEY_ALIAS" || { echo 'Missing GitHub Secret: SIGNING_KEY_ALIAS'; exit 1; }
          test -n "$SIGNING_KEY_PASSWORD" || { echo 'Missing GitHub Secret: SIGNING_KEY_PASSWORD'; exit 1; }
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gpja-release.keystore"
          test -s "$RUNNER_TEMP/gpja-release.keystore"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/gpja-release.keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Read APK version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | sed 's/versionName = "//;s/"//')
          VERSION_CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | sed 's/versionCode = //')
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Verify APK
        run: test -s app/build/outputs/apk/release/app-release.apk
      - name: Prepare release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/GPJA-Timetable-v${VERSION_NAME}.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpja-timetable-v${{ steps.version.outputs.version_name }}
          path: android-widget/app/build/outputs/apk/release/GPJA-Timetable-v${{ steps.version.outputs.version_name }}.apk
          if-no-files-found: error
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: GPJA Timetable v${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          files: android-widget/app/build/outputs/apk/release/GPJA-Timetable-v${{ steps.version.outputs.version_name }}.apk
