name: Build Android Widget

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-widget/**'
      - '.github/workflows/build-widget.yml'

permissions:
  contents: write

env:
  ADMIN_CODE: ${{ secrets.ADMIN_CODE }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-widget
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify phone/watch sync contract
        run: |
          grep -q 'PATH_SYNC = "/gpja/sync"' app/src/main/java/kr/co/gpja/timetable/widget/WearSync.kt
          grep -q 'PATH_REQUEST_SYNC = "/gpja/request/sync"' app/src/main/java/kr/co/gpja/timetable/widget/WearSync.kt
          grep -q 'PATH_ACK = "/gpja/ack"' app/src/main/java/kr/co/gpja/timetable/widget/WearSync.kt
          grep -q 'scheduleJson' app/src/main/java/kr/co/gpja/timetable/widget/WearSync.kt
          grep -q 'mealJson' app/src/main/java/kr/co/gpja/timetable/widget/WearSync.kt
          grep -q 'com.google.android.gms:play-services-wearable:19.0.0' app/build.gradle.kts
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gpja-android-debug-signing-key-v1
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Read APK version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | sed 's/versionName = "//;s/"//')
          VERSION_CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | sed 's/versionCode = //')
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/GPJA-Timetable-v${VERSION_NAME}.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpja-timetable-v${{ steps.version.outputs.version_name }}
          path: android-widget/app/build/outputs/apk/debug/GPJA-Timetable-v${{ steps.version.outputs.version_name }}.apk
          if-no-files-found: error
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: GPJA Timetable v${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          files: android-widget/app/build/outputs/apk/debug/GPJA-Timetable-v${{ steps.version.outputs.version_name }}.apk
