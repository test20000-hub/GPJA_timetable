name: Build Galaxy Watch Wear OS

on:
  workflow_dispatch:
  push:
    paths:
      - 'wear-os/**'
      - '.github/workflows/build-wear-os.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wear-os
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build Wear APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Build Wear release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Build Wear AAB
        run: gradle --no-daemon :app:bundleRelease
      - name: Verify outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
      - name: Upload Wear artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gpja-wear-os-v1.0.2
          path: |
            wear-os/app/build/outputs/apk/debug/app-debug.apk
            wear-os/app/build/outputs/apk/release/app-release.apk
            wear-os/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
