name: Build Galaxy Watch Wear OS

on:
  workflow_dispatch:
  push:
    paths:
      - 'wear-os/**'
      - '.github/workflows/build-wear-os.yml'

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wear-os
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Force and verify AndroidX configuration
        run: |
          printf '%s\n' 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' 'android.useAndroidX=true' 'kotlin.code.style=official' > gradle.properties
          grep -qx 'android.useAndroidX=true' gradle.properties
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/kotlin/kr/co/gpja/timetable/wear/MainActivity.kt
          gradle --version

      - name: Check Gradle configuration
        run: gradle --no-daemon --stacktrace -Pandroid.useAndroidX=true tasks --all > /tmp/wear-gradle-tasks.txt

      - name: Build Wear debug APK
        run: gradle --no-daemon --stacktrace -Pandroid.useAndroidX=true :app:assembleDebug

      - name: Build Wear release APK
        run: gradle --no-daemon --stacktrace -Pandroid.useAndroidX=true :app:assembleRelease

      - name: Build Wear release AAB
        run: gradle --no-daemon --stacktrace -Pandroid.useAndroidX=true :app:bundleRelease

      - name: Verify and normalize APK/AAB outputs
        run: |
          set -euo pipefail

          echo 'Discovered build outputs:'
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -size +0c -print | sort

          debug_apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' -size +0c -print -quit)"
          release_apk="$(find app/build/outputs/apk/release -type f -name '*.apk' -size +0c -print -quit)"
          release_aab="$(find app/build/outputs/bundle/release -type f -name '*.aab' -size +0c -print -quit)"

          test -n "$debug_apk"
          test -n "$release_apk"
          test -n "$release_aab"

          mkdir -p app/build/outputs/gpja
          cp "$debug_apk" app/build/outputs/gpja/gpja-wear-os-debug.apk
          cp "$release_apk" app/build/outputs/gpja/gpja-wear-os-release.apk
          cp "$release_aab" app/build/outputs/gpja/gpja-wear-os-release.aab

          test -s app/build/outputs/gpja/gpja-wear-os-debug.apk
          test -s app/build/outputs/gpja/gpja-wear-os-release.apk
          test -s app/build/outputs/gpja/gpja-wear-os-release.aab

          file app/build/outputs/gpja/gpja-wear-os-debug.apk
          file app/build/outputs/gpja/gpja-wear-os-release.apk
          file app/build/outputs/gpja/gpja-wear-os-release.aab

      - name: Upload Wear artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gpja-wear-os-v1.0.8
          path: |
            wear-os/app/build/outputs/gpja/gpja-wear-os-debug.apk
            wear-os/app/build/outputs/gpja/gpja-wear-os-release.apk
            wear-os/app/build/outputs/gpja/gpja-wear-os-release.aab
          if-no-files-found: error
