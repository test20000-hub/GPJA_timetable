name: Update timetable and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '15 18 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/timetable.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  TZ: Asia/Seoul

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch NEIS timetable
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: python scripts/fetch_timetable.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('data/timetable.json')
          if not p.exists():
              raise SystemExit('data/timetable.json was not generated')

          data = json.loads(p.read_text(encoding='utf-8'))
          rows = data.get('rows', [])
          school = data.get('school', {})
          print(f"Generated timetable rows: {len(rows)}")
          print(f"School: {school}")

          if school.get('name') != '군포중앙고등학교':
              raise SystemExit(f"Unexpected school name: {school.get('name')!r}")
          if school.get('officeCode') != 'J10':
              raise SystemExit(f"Unexpected office code: {school.get('officeCode')!r}")
          if school.get('schoolCode') != '7531272':
              raise SystemExit(f"Unexpected school code: {school.get('schoolCode')!r}")
          if not rows:
              raise SystemExit('NEIS returned no timetable rows')

          dates = sorted({r.get('date', '') for r in rows if r.get('date')})
          if not dates:
              raise SystemExit('Generated timetable contains no valid dates')
          print(f"Date range: {dates[0]} -> {dates[-1]}")

          bad_dates = [r.get('date') for r in rows if len(str(r.get('date', ''))) != 10 or '-' not in str(r.get('date', ''))]
          if bad_dates:
              raise SystemExit(f'Invalid date format found: {bad_dates[:3]}')

          target = [r for r in rows if str(r.get('grade')) == '1' and str(r.get('className')) == '5']
          if not target:
              raise SystemExit('No rows found for default class 1학년 5반')
          print(f"1학년 5반 rows: {len(target)}")
          print('Sample:', target[0])
          PY

      - name: Persist timetable data
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/timetable.json /tmp/timetable.json

          for attempt in 1 2 3; do
            echo "Persist attempt ${attempt}"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/timetable.json data/timetable.json
            git add data/timetable.json

            if git diff --cached --quiet; then
              echo 'No timetable data changes.'
              exit 0
            fi

            git commit -m 'chore: update timetable data'
            if git push origin HEAD:main; then
              echo 'Timetable data pushed successfully.'
              exit 0
            fi

            echo 'Push raced with another main update; retrying.'
            git reset --hard origin/main
          done

          echo 'Failed to persist timetable data after 3 attempts.'
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
