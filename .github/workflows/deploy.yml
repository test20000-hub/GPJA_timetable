name: Update timetable and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '15 18 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/timetable.json'
      - 'data/schedule.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  TZ: Asia/Seoul

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch NEIS timetable
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: python scripts/fetch_timetable.py

      - name: Fetch NEIS academic schedule
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: python scripts/fetch_schedule.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          timetable = json.loads(Path('data/timetable.json').read_text(encoding='utf-8'))
          schedule = json.loads(Path('data/schedule.json').read_text(encoding='utf-8'))
          rows = timetable.get('rows', [])
          school = timetable.get('school', {})
          print(f"Generated timetable rows: {len(rows)}")
          print(f"Generated academic schedule rows: {len(schedule.get('rows', []))}")
          print(f"School: {school}")

          if school.get('name') != '군포중앙고등학교':
              raise SystemExit(f"Unexpected school name: {school.get('name')!r}")
          if school.get('officeCode') != 'J10':
              raise SystemExit(f"Unexpected office code: {school.get('officeCode')!r}")
          if school.get('schoolCode') != '7531272':
              raise SystemExit(f"Unexpected school code: {school.get('schoolCode')!r}")
          if not rows:
              raise SystemExit('NEIS returned no timetable rows')
          if schedule.get('school', {}).get('name') != '군포중앙고등학교':
              raise SystemExit('Academic schedule school validation failed')
          if not schedule.get('rows'):
              raise SystemExit('NEIS returned no academic schedule rows')

          dates = sorted({r.get('date', '') for r in rows if r.get('date')})
          if not dates:
              raise SystemExit('Generated timetable contains no valid dates')
          print(f"Timetable date range: {dates[0]} -> {dates[-1]}")

          bad_dates = [r.get('date') for r in rows if len(str(r.get('date', ''))) != 10 or '-' not in str(r.get('date', ''))]
          if bad_dates:
              raise SystemExit(f'Invalid timetable date format found: {bad_dates[:3]}')

          print('No hard-coded default class/timetable validation is used.')
          print('Timetable sample:', rows[0])
          print('Schedule sample:', schedule['rows'][0])
          PY

      - name: Persist generated data
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/timetable.json /tmp/timetable.json
          cp data/schedule.json /tmp/schedule.json

          for attempt in 1 2 3; do
            echo "Persist attempt ${attempt}"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/timetable.json data/timetable.json
            cp /tmp/schedule.json data/schedule.json
            git add data/timetable.json data/schedule.json

            if git diff --cached --quiet; then
              echo 'No generated data changes.'
              break
            fi

            git commit -m 'chore: update timetable and academic schedule data'
            if git push origin HEAD:main; then
              echo 'Generated data pushed successfully.'
              break
            fi

            echo 'Push raced with another main update; retrying.'
            git reset --hard origin/main
          done

      - name: Sync README version history
        run: |
          set -e
          VERSION='2.0.1'
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          text=p.read_text(encoding='utf-8')
          entry='''### v2.0.1\n- 스마트 대시보드의 실시간 카운트다운과 상태 표시 개선\n- 브라우저 알림 권한이 허용된 경우 선택한 반의 시간표 변경 감지 알림 추가\n- 변경된 시간표 항목을 로컬 스냅샷과 비교하여 중복 알림을 제한\n- 스마트 대시보드 JavaScript 캐시 버전 갱신\n- 서비스 워커 캐시 `v13` 갱신\n- Android 앱 versionCode `21`, versionName `2.0.1` 반영\n- 사이트 풋터 및 메타 버전 `v2.0.1` 반영\n\n'''
          if '### v2.0.1' not in text:
              text=text.replace('## 버전 기록\n\n','## 버전 기록\n\n'+entry,1)
          import re
          text=re.sub(r'\*\*사이트: v[^*]+\*\*','**사이트: v2.0.1**',text,count=1)
          text=re.sub(r'\*\*Android 앱: v[^*]+\*\*','**Android 앱: v2.0.1**',text,count=1)
          text=text.replace('**v2.0.0 스마트 대시보드**','**v2.0.1 스마트 대시보드**',1)
          p.write_text(text,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then
            echo 'README already synchronized.'
          else
            git commit -m 'docs: record v2.0.1 release [skip ci]'
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
