name: Update timetable and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '15 18 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/timetable.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch NEIS timetable
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: python scripts/fetch_timetable.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/timetable.json')
          if not p.exists():
              raise SystemExit('data/timetable.json was not generated')
          data = json.loads(p.read_text(encoding='utf-8'))
          rows = data.get('rows', [])
          print(f'Generated timetable rows: {len(rows)}')
          if not rows:
              raise SystemExit('NEIS returned no timetable rows')
          dates = sorted({r.get('date','') for r in rows if r.get('date')})
          print(f'Date range: {dates[0]} -> {dates[-1]}')
          sample = next((r for r in rows if r.get('grade') == '1' and r.get('className') == '5'), rows[0])
          print('Sample:', sample)
          PY

      - name: Persist timetable data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/timetable.json
          if git diff --cached --quiet; then
            echo 'No timetable data changes.'
          else
            git commit -m 'chore: update timetable data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
