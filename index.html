<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="군포중앙고등학교 시간표" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css?v=8" />
  <title>군포중앙고 시간표</title>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="hero-copy">
        <div class="brand-mark" aria-hidden="true">G</div>
        <div>
          <p class="eyebrow">GPJA · TIMETABLE</p>
          <h1>군포중앙고등학교</h1>
          <p class="hero-subtitle">학년·반만 고르면 이번 주 수업을 바로 확인할 수 있습니다.</p>
        </div>
      </div>
      <button id="installBtn" class="icon-btn" hidden aria-label="앱 설치" title="앱 설치">＋</button>
    </header>

    <nav class="app-tabs" aria-label="서비스 메뉴">
      <a class="app-tab active" href="index.html" aria-current="page"><span>▦</span> 시간표</a>
      <a class="app-tab" href="schedule.html"><span>□</span> 학사일정</a>
    </nav>

    <section class="week-card card" aria-label="주간 선택">
      <button id="prevWeek" class="nav-btn" aria-label="이전 주">‹</button>
      <div class="date-heading">
        <span class="week-kicker">WEEKLY SCHEDULE</span>
        <strong id="weekLabel">시간표</strong>
        <span id="updatedLabel">불러오는 중…</span>
      </div>
      <button id="nextWeek" class="nav-btn" aria-label="다음 주">›</button>
    </section>

    <section class="controls-card card" aria-label="학년과 반 선택">
      <div class="control-group">
        <span class="control-label">학년</span>
        <label class="select-wrap"><select id="gradeSelect" aria-label="학년 선택"></select><span class="select-chevron">⌄</span></label>
      </div>
      <div class="control-group">
        <span class="control-label">반</span>
        <label class="select-wrap"><select id="classSelect" aria-label="반 선택"></select><span class="select-chevron">⌄</span></label>
      </div>
      <button id="todayBtn" class="today-btn"><span>●</span> 이번 주</button>
    </section>

    <section class="notification-card card">
      <div><strong>쉬는 시간 알림</strong><small id="notificationStatus">다음 교시 시작 전에 알림을 받을 수 있습니다.</small></div>
      <button id="notificationBtn" class="notification-btn">알림 켜기</button>
    </section>

    <section id="notice" class="notice" hidden></section>
    <section id="todayCard" class="today-card card" hidden></section>

    <section class="section-heading">
      <div>
        <p class="section-kicker">CLASS TIMETABLE</p>
        <h2>주간 시간표</h2>
      </div>
      <div class="legend" aria-label="시간표 표시 안내">
        <span><i class="legend-dot changed-dot"></i>변경</span>
        <span><i class="legend-bar subject-bar"></i>과목</span>
        <span><i class="legend-current"></i>현재</span>
      </div>
    </section>
    <section id="timetable" class="timetable card" aria-live="polite"></section>
  </main>

  <footer>
    <div class="footer-inner">
      <div>NEIS 고등학교시간표 · 군포중앙고등학교<br><small>© 2026 GPJA Timetable. All rights reserved.</small></div>
      <span class="version">v1.1.0</span>
    </div>
  </footer>
  <script src="app.js?v=7" defer></script>
</body>
</html>
